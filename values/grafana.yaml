admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
  hosts:
    - grafana.jlab.dedyn.io
  tls:
    - hosts:
        - grafana.jlab.dedyn.io

persistence:
  enabled: false

grafana.ini:
  server:
    domain: grafana.jlab.dedyn.io
  auth.ldap:
    enabled: false

extraSecretMounts:
  - name: postgres-creds
    secretName: clearbook-db-app
    mountPath: /etc/secrets/postgres
    readOnly: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: PostgreSQL
        type: postgres
        url: clearbook-db-r.default.svc.cluster.local:5432
        database: clearbook
        user: $__file{/etc/secrets/postgres/username}
        secureJsonData:
          password: $__file{/etc/secrets/postgres/password}
        jsonData:
          sslmode: require
          postgresVersion: 1600
          database: clearbook
          timescaledb: false
        editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "default"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboardsConfigMaps:
  default: clearbook-grafana-dashboards
