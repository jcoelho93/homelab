hostNetwork: false

service:
  enabled: false

ports:
  web:
    port: 80
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    hostPort: 443
    http:
      tls:
        enabled: true
        certResolver: letsencrypt

persistence:
  enabled: true

rbac:
  enabled: true

securityContext:
  capabilities:
    add:
      - NET_BIND_SERVICE
  runAsNonRoot: false
  runAsUser: 0

certificatesResolvers:
  letsencrypt:
    acme:
      httpChallenge:
        entryPoint: web
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      email: camilocoelho93@gmail.com
      dnsChallenge:
        provider: desec
      storage: /data/acme.json

env:
  - name: DESEC_TOKEN
    valueFrom:
      secretKeyRef:
        name: desec-credentials
        key: token
