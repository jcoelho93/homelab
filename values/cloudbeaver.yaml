hostname: cloudbeaver.jlab.dedyn.io

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: authelia-chain-authelia-auth@kubernetescrd

persistence:
  enabled: true
  storageClass: "local-path"
  size: 1Gi

extraVolumes:
  - name: cloudbeaver-provided-connections
    configMap:
      name: cloudbeaver-provided-connections
      items:
        - key: provided_connections
          path: data-sources.json

extraVolumeMounts:
  - name: cloudbeaver-provided-connections
    mountPath: /opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources.json
    subPath: data-sources.json
    readOnly: true

