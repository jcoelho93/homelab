name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

env:
  TF_VERSION: '1.15.8'
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: '0'

# Terraform state is remote and locked; never run two of these at once.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint / Format / Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

      # No credentials needed: validate only checks syntax and provider schemas.
      - name: Terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -lockfile=readonly

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.60.0

      - name: TFLint
        working-directory: terraform
        run: |
          tflint --init
          tflint --format compact

  plan:
    name: Plan
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DESEC_API_TOKEN: ${{ secrets.DESEC_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init -lockfile=readonly

      - name: Terraform plan
        id: plan
        working-directory: terraform
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan | tee plan.txt
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          # 0 = no changes, 2 = changes present, anything else is a real failure
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            terraform/tfplan
            terraform/plan.txt
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const max = 60000;
            if (plan.length > max) {
              plan = plan.slice(0, max) + '\n\n... output truncated, see the workflow logs.';
            }
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n### Terraform Plan \`terraform/\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: Apply
    needs: plan
    # Only on main, and only when the plan actually produced changes.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.exitcode == '2'
    runs-on: ubuntu-latest
    environment: production
    env:
      DESEC_API_TOKEN: ${{ secrets.DESEC_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init -lockfile=readonly

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: terraform

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -no-color -auto-approve tfplan
