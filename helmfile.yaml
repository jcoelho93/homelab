kubeContext: homelab-master1

repositories:
  - name: metrics-server
    url: https://kubernetes-sigs.github.io/metrics-server/
  - name: traefik
    url: https://helm.traefik.io/traefik
  - name: postgres-operator-charts
    url: https://opensource.zalando.com/postgres-operator/charts/postgres-operator
  - name: postgres-operator-ui-charts
    url: https://opensource.zalando.com/postgres-operator/charts/postgres-operator-ui
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: authelia
    url: https://charts.authelia.com

releases:
  - name: authelia
    namespace: authelia
    createNamespace: true
    chart: authelia/authelia
    version: 0.11.5
    values:
      - values/authelia.yaml
  - name: grafana
    namespace: default
    chart: grafana/grafana
    version: 10.5.15
    values:
      - values/grafana.yaml
    secrets:
      - secrets/grafana.enc.yaml
  - name: metrics-server
    namespace: kube-system
    createNamespace: false
    version: 3.13.0
    chart: metrics-server/metrics-server
  - name: traefik
    namespace: kube-system
    createNamespace: false
    chart: traefik/traefik
    version: 40.2.0
    values:
      - values/traefik.yaml
  - name: middleware
    namespace: default
    chart: ./charts/middleware
  - name: postgres-operator
    namespace: postgres-operator
    createNamespace: true
    chart: postgres-operator-charts/postgres-operator
    version: 1.15.1
    disableValidation: true
  - name: postgres-operator-ui
    namespace: postgres-operator
    createNamespace: true
    chart: postgres-operator-ui-charts/postgres-operator-ui
    version: 1.15.1
    needs:
      - postgres-operator
